{% extends "base.html" %}
{% block conteudo %}
<form class="caixa estreita" method="post">
  <h1>Entrar</h1>
  <label>E-mail <input type="email" name="email" required></label>
  <label>Senha <input type="password" name="senha" required></label>
  <button class="btn">Entrar</button>
  <p><a href="{{ url_for('esqueci_senha') }}">Esqueci minha senha</a></p>
  <p>Não tem conta? <a href="{{ url_for('cadastro') }}">Criar conta</a></p>
</form>
{% endblock %}
